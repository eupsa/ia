name: local-chat
services:
  ollama:
    image: ollama/ollama:0.18.1
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_QUEUE: 4
    volumes:
      - models:/root/.ollama
    cpus: 2
    mem_limit: 8g
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      DB_PATH: /data/chat.db
      SEARCH_URL: http://search:8080
    volumes:
      - data:/data
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:80
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
  search:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./deploy/searxng-settings.yml:/etc/searxng/settings.yml:ro
    cpus: 0.5
    mem_limit: 384m
volumes:
  models:
  data:
